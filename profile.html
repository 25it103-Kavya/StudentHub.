<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | StudentHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  
  <button id="themeBtn">🌙 Dark Mode</button>
  <a class="brand" href="index.html">Student<span>Hub</span></a>

  <div>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="events.html">Events</a>
    <a href="index.html">Logout</a>
  </div>
</nav>

<main class="container">
  <form class="form-card" data-message="Profile updated successfully!">

    <h2>My Profile</h2>

    <div class="field">
      <label>Full Name</label>
      <input type="text" value="Student User" required>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" value="student@example.com" required>
    </div>

    <div class="field">
      <label>Phone Number</label>
      <input type="tel" placeholder="Enter phone number">
    </div>

    <div class="field">
      <label>About Me</label>
      <textarea placeholder="Write something about yourself"></textarea>
    </div>

    <button class="btn" type="submit">Save Profile</button>
  </form>
</main>

<footer class="footer">
  © <span id="year"></span> StudentHub Portal
</footer>

<script src="js/script.js"></script>
</body>
</html>
