<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StudentHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  
  <button id="themeBtn">🌙 Dark Mode</button>
  <a class="brand" href="index.html">Student<span>Hub</span></a>

  <div>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="events.html">Events</a>
    <a href="contact.html">Contact</a>
    <a href="register.html">Register</a>
  </div>
</nav>

<main class="container">
  <form class="form-card" data-message="Login successful!">

    <h2>Student Login</h2>

    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="student@example.com" required>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="Enter password" required>
    </div>

    <button class="btn" type="submit">Login</button>

    <p>
      New student?
      <a href="register.html">Create an account</a>
    </p>
  </form>
</main>

<footer class="footer">
  © <span id="year"></span> StudentHub Portal
</footer>

<script src="js/script.js"></script>
</body>
</html>
