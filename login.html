```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | StudentHub</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">

    <div class="container">

        <button
            id="darkModeBtn"
            class="dark-mode-btn"
            type="button">

            🌙 Dark Mode

        </button>

        <h2 class="logo">
            StudentHub
        </h2>

        <nav class="nav"
             aria-label="Main navigation">

            <a href="index.html">Home</a>

            <a href="about.html">About</a>

            <a href="events.html">Events</a>

            <a href="contact.html">Contact</a>

            <a href="login.html">Login</a>

        </nav>

    </div>

</header>


<!-- =====================================================
     LOGIN
====================================================== -->

<main class="login-page">

    <div class="login-card">

        <h1>
            Welcome Back
        </h1>

        <p class="login-subtitle">
            Login to your StudentHub account
        </p>


        <form id="loginForm">


            <!-- EMAIL -->

            <div class="field">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    minlength="6"
                    required>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                class="btn"
                type="submit">

                Login

            </button>


        </form>


        <div class="login-links">

            <p>
                Don't have an account?
                <a href="register.html">
                    Register here
                </a>
            </p>

        </div>

    </div>

</main>


<!-- =====================================================
     FOOTER
====================================================== -->

<footer class="footer">

    <p>
        © <span id="year"></span> StudentHub Portal
    </p>

</footer>


<script src="js/script.js"></script>

</body>
</html>
```
